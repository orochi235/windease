name: Release

on:
  push:
    tags: ['v*']

# No NPM_TOKEN: this publishes via npm trusted publishing (OIDC), so the
# credential is short-lived and minted per run. `id-token: write` is what
# makes that possible — without it npm falls back to looking for a token
# and fails. The npmjs.com side must name this exact filename.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The drift this guards against: v0.7.0 was published from a commit
      # 48 commits behind the version bump it claimed to be, so npm's
      # 0.7.0 and the repo's "shipped in 0.7.0" notes disagreed for
      # months. A tag that doesn't match package.json now fails here
      # instead of shipping.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg"
            exit 1
          fi

      # The tarball carries README.md and CHANGELOG.md, so a heading still
      # saying "Unreleased" ships to consumers who already have the code.
      - name: Changelog must name this version
        run: scripts/check-changelog.sh "${GITHUB_REF_NAME}"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/check-changelog.sh --extract "${GITHUB_REF_NAME}" > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/notes.md
