name: Release

on:
  push:
    tags: ['v*']

# No NPM_TOKEN: this publishes via npm trusted publishing (OIDC), so the
# credential is short-lived and minted per run. `id-token: write` is what
# makes that possible — without it npm falls back to looking for a token
# and fails. The npmjs.com side must name this exact filename.
permissions:
  contents: read
  id-token: write

# Opt into Node 24 for JavaScript actions ahead of the September 2026 forced
# cutover. Drop this once the actions themselves declare Node 24 support.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # .nvmrc pins Node 22, which ships npm 10.x. Trusted publishing needs
      # npm >= 11.5.1, so the bundled CLI can't do it.
      - name: Use an npm that can do OIDC
        run: npm install -g npm@latest

      - run: npm ci

      # The drift this guards against: v0.7.0 was published from a commit
      # 48 commits behind the version bump it claimed to be, so npm's
      # 0.7.0 and the repo's "shipped in 0.7.0" notes disagreed for
      # months. A tag that doesn't match package.json now fails here
      # instead of shipping.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Publish
        run: npm publish --provenance --access public
